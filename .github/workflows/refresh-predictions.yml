name: Prediction release

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * *'
      timezone: Europe/Zagreb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-prediction-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_upcoming: ${{ steps.release.outputs.has_upcoming }}
      min_gameweek: ${{ steps.release.outputs.min_gameweek }}
      max_gameweek: ${{ steps.release.outputs.max_gameweek }}
      player_count: ${{ steps.release.outputs.player_count }}
      fetched_at: ${{ steps.release.outputs.fetched_at }}
      fplreview_players: ${{ steps.release.outputs.fplreview_players }}
      blended_fixtures: ${{ steps.release.outputs.blended_fixtures }}
      fallback_fixtures: ${{ steps.release.outputs.fallback_fixtures }}
      reviewed_lineups: ${{ steps.release.outputs.reviewed_lineups }}
      automatic_lineups: ${{ steps.release.outputs.automatic_lineups }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run tests
        run: npm test

      - name: Validate fixture data
        run: npm run validate:fixtures

      - name: Build or refresh and validate predictions
        id: release
        env:
          FFH_TOKEN: ${{ secrets.FFH_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            npm run build
            npm run validate:public
            echo 'has_upcoming=true' >> "$GITHUB_OUTPUT"
            echo 'release_mode=committed snapshot' >> "$GITHUB_OUTPUT"
          else
            npm run refresh:predictions
            echo 'release_mode=live refresh' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tracked files are unchanged
        if: steps.release.outcome == 'success'
        run: git diff --exit-code

      - name: Configure GitHub Pages
        if: steps.release.outputs.has_upcoming == 'true'
        uses: actions/configure-pages@v6

      - name: Upload sanitized Pages artifact
        if: steps.release.outputs.has_upcoming == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy sanitized bundle to Cloudflare Pages
        id: cloudflare
        if: steps.release.outputs.has_upcoming == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            pages deploy public
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}

      - name: Write release summary
        if: always()
        env:
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_MODE: ${{ steps.release.outputs.release_mode }}
          HAS_UPCOMING: ${{ steps.release.outputs.has_upcoming }}
          MIN_GAMEWEEK: ${{ steps.release.outputs.min_gameweek }}
          MAX_GAMEWEEK: ${{ steps.release.outputs.max_gameweek }}
          PLAYER_COUNT: ${{ steps.release.outputs.player_count }}
          FETCHED_AT: ${{ steps.release.outputs.fetched_at }}
          FPLREVIEW_PLAYERS: ${{ steps.release.outputs.fplreview_players }}
          BLENDED_FIXTURES: ${{ steps.release.outputs.blended_fixtures }}
          FALLBACK_FIXTURES: ${{ steps.release.outputs.fallback_fixtures }}
          REVIEWED_LINEUPS: ${{ steps.release.outputs.reviewed_lineups }}
          AUTOMATIC_LINEUPS: ${{ steps.release.outputs.automatic_lineups }}
          CLOUDFLARE_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          echo '## Prediction release' >> "$GITHUB_STEP_SUMMARY"
          echo "- Release result: ${RELEASE_OUTCOME:-not run}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Data mode: ${RELEASE_MODE:-not run}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upcoming gameweek available: ${HAS_UPCOMING:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_UPCOMING" = 'true' ]; then
            echo "- Requested range: GW${MIN_GAMEWEEK}-${MAX_GAMEWEEK}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Players: ${PLAYER_COUNT}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Fetched at: ${FETCHED_AT}" >> "$GITHUB_STEP_SUMMARY"
            echo "- FPL Review matched players: ${FPLREVIEW_PLAYERS:-0}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Blended player-gameweeks: ${BLENDED_FIXTURES:-0}" >> "$GITHUB_STEP_SUMMARY"
            echo "- FFH fallback player-gameweeks: ${FALLBACK_FIXTURES:-0}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Predicted lineups: ${REVIEWED_LINEUPS:-0} reviewed, ${AUTOMATIC_LINEUPS:-0} automatic" >> "$GITHUB_STEP_SUMMARY"
            echo "- Cloudflare Pages: ${CLOUDFLARE_URL:-deployment unavailable}" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: needs.build.result == 'success' && needs.build.outputs.has_upcoming == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Write deployment summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo '## GitHub Pages deployment' >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
