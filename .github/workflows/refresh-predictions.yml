name: Daily predicted-points refresh

on:
  schedule:
    - cron: '17 5 * * *'
      timezone: Europe/Zagreb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-prediction-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_upcoming: ${{ steps.refresh.outputs.has_upcoming }}
      min_gameweek: ${{ steps.refresh.outputs.min_gameweek }}
      max_gameweek: ${{ steps.refresh.outputs.max_gameweek }}
      player_count: ${{ steps.refresh.outputs.player_count }}
      fetched_at: ${{ steps.refresh.outputs.fetched_at }}
      reviewed_lineups: ${{ steps.refresh.outputs.reviewed_lineups }}
      automatic_lineups: ${{ steps.refresh.outputs.automatic_lineups }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run tests
        run: npm test

      - name: Validate fixture data
        run: npm run validate:fixtures

      - name: Refresh and validate predictions
        id: refresh
        env:
          FFH_TOKEN: ${{ secrets.FFH_TOKEN }}
        run: npm run refresh:predictions

      - name: Verify tracked files are unchanged
        if: steps.refresh.outcome == 'success'
        run: git diff --exit-code

      - name: Configure GitHub Pages
        if: steps.refresh.outputs.has_upcoming == 'true'
        uses: actions/configure-pages@v6

      - name: Upload sanitized Pages artifact
        if: steps.refresh.outputs.has_upcoming == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy sanitized bundle to Cloudflare Pages
        id: cloudflare
        if: steps.refresh.outputs.has_upcoming == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy public
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}

      - name: Write refresh summary
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          HAS_UPCOMING: ${{ steps.refresh.outputs.has_upcoming }}
          MIN_GAMEWEEK: ${{ steps.refresh.outputs.min_gameweek }}
          MAX_GAMEWEEK: ${{ steps.refresh.outputs.max_gameweek }}
          PLAYER_COUNT: ${{ steps.refresh.outputs.player_count }}
          FETCHED_AT: ${{ steps.refresh.outputs.fetched_at }}
          REVIEWED_LINEUPS: ${{ steps.refresh.outputs.reviewed_lineups }}
          AUTOMATIC_LINEUPS: ${{ steps.refresh.outputs.automatic_lineups }}
          CLOUDFLARE_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          echo '## Predicted-points refresh' >> "$GITHUB_STEP_SUMMARY"
          echo "- Refresh result: ${REFRESH_OUTCOME:-not run}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upcoming gameweek available: ${HAS_UPCOMING:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_UPCOMING" = 'true' ]; then
            echo "- Requested range: GW${MIN_GAMEWEEK}-${MAX_GAMEWEEK}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Players: ${PLAYER_COUNT}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Fetched at: ${FETCHED_AT}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Predicted lineups: ${REVIEWED_LINEUPS:-0} reviewed, ${AUTOMATIC_LINEUPS:-0} automatic" >> "$GITHUB_STEP_SUMMARY"
            echo "- Cloudflare Pages: ${CLOUDFLARE_URL:-deployment unavailable}" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: needs.build.result == 'success' && needs.build.outputs.has_upcoming == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Write deployment summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo '## GitHub Pages deployment' >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
